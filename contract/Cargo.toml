[package]
name = "deaddrop"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
license = "MIT"
description = "Paid encrypted drops with escrowed key delivery and a dead-man switch on NEAR"
repository = "https://github.com/Hothit1/deaddrop"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "~5.17"

[dev-dependencies]
near-sdk = { version = "~5.17", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
